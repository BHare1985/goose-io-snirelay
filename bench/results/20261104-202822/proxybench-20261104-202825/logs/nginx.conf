load_module /usr/lib/nginx/modules/ngx_stream_module.so;
user root;
worker_processes 1;
worker_rlimit_nofile 65535;
daemon off;
pid /tmp/proxybench.rE6iRG/nginx.pid;
error_log /tmp/proxybench.rE6iRG/nginx_error.log warn;
events { worker_connections 16384; multi_accept on; }
stream {
    upstream be { server 127.0.0.1:18080; }
    server {
        listen 127.0.0.1:18444 reuseport;
        proxy_pass be;
        proxy_buffer_size 128k;    # tuned: +18% at 64 KiB vs 64k (+7% for 64k vs 32k), small unchanged
        proxy_half_close on;       # keep the other direction open after one side sends FIN (like the others)
        tcp_nodelay on;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
